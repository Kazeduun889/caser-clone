<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caser — профиль</title>
<!-- The real stylesheets: this is where --font-oswald, --font-sofia-sans,
     --brand-accent and every surface shade come from. Keeping a private copy of
     those values here is what made the page drift from the rest of the site. -->
<link rel="stylesheet" href="/_next/static/chunks/03rygwhrpje4o.css">
<link rel="stylesheet" href="/_next/static/chunks/2h7znwflj3yb4.css">
<link rel="stylesheet" href="/_next/static/chunks/17tdfa7y23qrt.css">
<link rel="stylesheet" href="/custom-auth.css">
<style>
/* ---------------------------------------------------------------------------
   Every visual value comes from the site's own stylesheets, loaded above.
   Only the layout rules live here - the profile screen is one the original
   renders behind a login, so there is no upstream markup to inherit from.
   --------------------------------------------------------------------------- */
  :root {
    /* Fallbacks for a failed stylesheet. The real values are --brand-accent
       #44C987, --brand-nav-active #83D8FF, --brand-header-bg #2D3540,
       surfaces black-250 #00000040 and black-450 #00000073. */
    --brand-accent: #44C987;
    --brand-nav-active: #83D8FF;
    --brand-header-bg: #2D3540;
    --brand-balance-text: #83D8FF;
    --brand-btn-text: #44C987;
    --brand-btn-border: #44C987;
    --brand-btn-bg: linear-gradient(180deg, #13432C 0%, #0F2E20 100%);
    --surface-250: #00000040;
    --surface-450: #00000073;
    --line-150: #ffffff26;
    --text-450: #ffffff73;
    --text-550: #ffffff8c;
    --text-650: #ffffffa6;
    --radius: 0.2rem;
  }

  * { box-sizing: border-box; }

  html, body {
    background: #000;
    color: #fff;
    min-height: 100%;
  }

  body {
    font-family: var(--font-sofia-sans), "Sofia Sans", "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 1.4rem;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* --- top bar, same surface as the site header --- */
  .topbar {
    background: var(--brand-header-bg);
    border-bottom: 0.1rem solid #00000040;
  }
  .topbar-inner {
    max-width: 80rem;
    margin: 0 auto;
    padding: 1.2rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.6rem;
  }
  .brand {
    font-family: var(--font-oswald), Oswald, sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    text-decoration: none;
  }
  .topbar-nav { display: flex; gap: 2rem; margin-left: auto; }
  .topbar-nav a {
    color: var(--text-550);
    text-decoration: none;
    font-size: 1.3rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color .15s;
  }
  .topbar-nav a:hover { color: var(--brand-nav-active); }

  .page {
    max-width: 80rem;
    margin: 0 auto;
    padding: 2.4rem 2rem 6rem;
    display: grid;
    gap: 1.6rem;
  }

  /* --- panels --- */
  .panel {
    background: var(--surface-250);
    border: 0.1rem solid var(--line-150);
    border-radius: var(--radius);
    padding: 2rem;
  }
  .panel-title {
    font-family: var(--font-oswald), Oswald, sans-serif;
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-550);
    margin: 0 0 1.6rem;
  }

  /* --- identity --- */
  .identity { display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }

  .avatar {
    position: relative;
    width: 8.8rem; height: 8.8rem;
    flex: none;
    border-radius: var(--radius);
    overflow: visible;
    border: 0.2rem solid var(--brand-accent);
    background: #00000073;
  }
  .avatar > img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: var(--radius);
    display: block;
  }
  /* the creator tick - only ever rendered because the server said so */
  .tick {
    position: absolute;
    right: -0.8rem; bottom: -0.8rem;
    width: 2.6rem; height: 2.6rem;
    border-radius: 50%;
    background: var(--brand-accent);
    border: 0.2rem solid #000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .tick.on { display: flex; }
  .tick svg { width: 1.4rem; height: 1.4rem; display: block; }

  .id-block { min-width: 20rem; flex: 1; }

  .nick-row { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
  .nick {
    font-family: var(--font-oswald), Oswald, sans-serif;
    font-size: 2.4rem;
    font-weight: 600;
    line-height: 1.2;
    text-transform: uppercase;
  }
  .creator-tag {
    display: none;
    align-items: center;
    gap: 0.4rem;
    background: rgba(68, 201, 135, 0.12);
    border: 0.1rem solid var(--brand-accent);
    color: var(--brand-accent);
    border-radius: 999px;
    padding: 0.2rem 0.9rem;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .creator-tag.on { display: inline-flex; }
  .creator-tag svg { width: 1.1rem; height: 1.1rem; }

  .uid { color: var(--text-450); font-size: 1.2rem; margin-top: 0.4rem; word-break: break-all; }

  /* --- numeric tiles, same family as the balance widget --- */
  .tiles { display: flex; gap: 3.2rem; flex-wrap: wrap; margin-left: auto; }
  .tile .k {
    font-size: 1.05rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-450);
  }
  .tile .v {
    font-family: var(--font-oswald), Oswald, sans-serif;
    font-size: 2rem;
    font-weight: 600;
    line-height: 1.2;
    color: #fff;
  }
  .tile.balance .v { color: var(--brand-balance-text); }

  /* --- form --- */
  label { display: block; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; color: var(--text-450); margin-bottom: 0.6rem; }
  input {
    width: 100%;
    padding: 1.1rem 1.3rem;
    background: var(--surface-450);
    border: 0.1rem solid var(--line-150);
    border-radius: var(--radius);
    color: #fff;
    font: inherit;
    font-family: inherit;
  }
  input::placeholder { color: var(--text-450); }
  input:focus { outline: none; border-color: var(--brand-accent); }
  input.code {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
  }

  /* The primary button uses the site's own gradient + glow. */
  .btn {
    padding: 1.1rem 2.4rem;
    border-radius: var(--radius);
    border: 0.1rem solid var(--brand-btn-border);
    background: var(--brand-btn-bg);
    color: var(--brand-btn-text);
    font: inherit;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: inset 0 0 1.66rem rgba(68, 201, 135, 0.4);
    transition: background .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, #1D5A3A 0%, #13432C 100%);
    box-shadow: inset 0 0 1.66rem rgba(68, 201, 135, 0.6);
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .promo-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .promo-row input { flex: 1; min-width: 22rem; }
  .promo-row .btn { flex: none; }

  .msg { margin-top: 1.2rem; font-size: 1.3rem; min-height: 2rem; }
  .msg.ok { color: var(--brand-accent); }
  .msg.err { color: #ff5252; }
  .msg.info { color: var(--text-550); }

  .hint { color: var(--text-450); font-size: 1.2rem; margin: 0.6rem 0 0; }

  /* --- table --- */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 1rem 1.2rem; border-bottom: 0.1rem solid var(--line-150); }
  th { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-450); font-weight: 500; }
  td.num, th.num { text-align: right; }
  td.amount { font-family: var(--font-oswald), Oswald, sans-serif; font-size: 1.5rem; }
  td.code-cell code {
    background: var(--surface-450);
    border: 0.1rem solid var(--line-150);
    border-radius: var(--radius);
    padding: 0.2rem 0.7rem;
    letter-spacing: 0.1em;
    font-weight: 600;
  }
  td.when { color: var(--text-450); }
  .empty { text-align: center; color: var(--text-450); padding: 3rem 0; }

  @media (max-width: 700px) {
    .tiles { margin-left: 0; gap: 2rem; }
    .topbar-nav a { display: none; }
    .promo-row input { min-width: 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/ru">Кейсер</a>
    <nav class="topbar-nav">
      <a href="/ru/cases">Кейсы</a>
      <a href="/ru/inventory">Инвентарь</a>
      <a href="/ru/rewards">Награды</a>
    </nav>
  </div>
</div>

<div class="page">

  <div class="panel">
    <h1 class="panel-title">Профиль</h1>
    <div class="identity">
      <div class="avatar">
        <img id="avatar" alt="">
        <div class="tick" id="tick" title="Автор">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0a1a12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
      <div class="id-block">
        <div class="nick-row">
          <span class="nick" id="nick">—</span>
          <span class="creator-tag" id="creatorTag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Автор
          </span>
        </div>
        <div class="uid" id="uid">—</div>
      </div>
      <div class="tiles">
        <div class="tile balance"><div class="k">Баланс</div><div class="v" id="balance">—</div></div>
        <div class="tile"><div class="k">Предметов</div><div class="v" id="items">—</div></div>
        <div class="tile"><div class="k">Регистрация</div><div class="v" id="since" style="font-size:1.4rem">—</div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2 class="panel-title">Промокод</h2>
    <p class="hint">Введите код, который вам выдали. Сумма зачисляется на баланс, код действует один раз на аккаунт.</p>
    <div class="promo-row" style="margin-top:1.4rem">
      <input class="code" type="text" id="code" placeholder="ВВЕДИТЕ КОД" autocomplete="off" spellcheck="false">
      <button class="btn" id="redeemBtn">Активировать</button>
    </div>
    <div class="msg" id="promoMsg"></div>
  </div>

  <div class="panel">
    <h2 class="panel-title">Активированные промокоды</h2>
    <div id="history"></div>
  </div>

</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function money(n) {
    return '$' + (Number(n) || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function when(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return isNaN(d.getTime()) ? '—' : d.toLocaleDateString('ru-RU');
  }
  function say(el, text, kind) {
    el.textContent = text || '';
    el.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(user, itemCount) {
    $('nick').textContent = user.nickname || 'Игрок';
    $('uid').textContent = user.id;
    $('avatar').src = user.image || '';
    $('balance').textContent = money(user.balance);
    if (itemCount != null) $('items').textContent = itemCount;
    if (user.createdAt) $('since').textContent = when(user.createdAt);

    // The tick mirrors the server flag; the page cannot grant it to itself.
    var creator = !!user.isCreator;
    $('tick').classList.toggle('on', creator);
    $('creatorTag').classList.toggle('on', creator);
  }

  function loadProfile() {
    return fetch('/api/users/me', { headers: { 'X-Requested-With': 'fetch' } })
      .then(function (r) { return r.json(); })
      .then(function (me) {
        if (!me || me.status === 401) throw new Error('Нужно войти в аккаунт');
        return fetch('/api/items/inventory?limit=1').then(function (r) { return r.json(); }).catch(function () { return null; })
          .then(function (inv) {
            render(me, inv && typeof inv.total === 'number' ? inv.total : null);
          });
      });
  }

  function loadHistory() {
    return fetch('/api/promo/mine').then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d && d.items) || [];
        if (!items.length) {
          $('history').innerHTML = '<div class="empty">Активированных промокодов пока нет</div>';
          return;
        }
        $('history').innerHTML =
          '<table><thead><tr><th>Код</th><th class="num">Сумма</th><th class="num">Дата</th></tr></thead><tbody>' +
          items.map(function (i) {
            return '<tr><td class="code-cell"><code>' + esc(i.code) + '</code></td>' +
              '<td class="num amount">' + money(i.amount) + '</td>' +
              '<td class="num when">' + esc(when(i.createdAt)) + '</td></tr>';
          }).join('') + '</tbody></table>';
      })
      .catch(function () {
        $('history').innerHTML = '<div class="empty">Активированных промокодов пока нет</div>';
      });
  }

  var redeemBtn = $('redeemBtn');
  redeemBtn.onclick = function () {
    var code = $('code').value.trim();
    if (!code) { say($('promoMsg'), 'Введите код', 'err'); return; }

    redeemBtn.disabled = true;
    say($('promoMsg'), 'Проверяем код...', 'info');

    fetch('/api/promo/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.body.success) {
          throw new Error((res.body && res.body.message) || 'Не удалось активировать код');
        }
        var d = res.body.data;
        say($('promoMsg'), 'Код активирован: ' + money(d.amount) +
          (d.remaining > 0 ? ' — осталось активаций: ' + d.remaining : ''), 'ok');
        $('code').value = '';
        $('balance').textContent = money(d.balance);
        loadHistory();
      })
      .catch(function (e) {
        say($('promoMsg'), e.message || 'Не удалось активировать код', 'err');
      })
      .finally(function () { redeemBtn.disabled = false; });
  };

  $('code').onkeydown = function (e) { if (e.key === 'Enter') redeemBtn.click(); };

  // Live balance and creator tick over the existing WebSocket.
  (function connect() {
    try {
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var ws = new WebSocket(proto + '//' + location.host + '/api/ws');
      ws.onmessage = function (ev) {
        try {
          var msg = JSON.parse(ev.data);
          if (!msg || !msg.event) return;
          if (msg.event === 'users.update_balance') {
            var v = typeof msg.data === 'number' ? msg.data : parseFloat(msg.data);
            if (isFinite(v)) $('balance').textContent = money(v);
          }
          if (msg.event === 'users.update_creator') {
            var on = !!msg.data.isCreator;
            $('tick').classList.toggle('on', on);
            $('creatorTag').classList.toggle('on', on);
          }
        } catch (e) { /* ignore */ }
      };
      ws.onclose = function () { setTimeout(connect, 3000); };
    } catch (e) { /* no websocket */ }
  })();

  // ?promo=CODE, like the original's promo links.
  var fromLink = new URLSearchParams(location.search).get('promo');
  if (fromLink) {
    $('code').value = fromLink;
    redeemBtn.click();
  }

  loadProfile().catch(function (e) { say($('promoMsg'), e.message, 'err'); });
  loadHistory();
})();
</script>
</body>
</html>

services:
  - type: web
    name: caser-clone
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Render injects PORT automatically; the server binds 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      # --- Database ----------------------------------------------------------
      # Leave DATABASE_URL empty to use a local SQLite file. NOTE: on the Free
      # plan the filesystem is ephemeral, so that file is lost on every
      # spin-down / redeploy.
      #
      # For a database that survives, create a free Turso database
      # (https://turso.tech) and paste the values here:
      #   DATABASE_URL=libsql://<db-name>.turso.io
      #   DATABASE_AUTH_TOKEN=<token>
      - key: DATABASE_URL
        value: ""
      - key: DATABASE_AUTH_TOKEN
        value: ""
      - key: DATA_DIR
        value: ./data
      - key: CASES_CACHE_DIR
        value: ./cases_cache
      - key: REMOTE_CDN
        value: https://cdn.caser.day
    # Uncomment once you move to a paid plan and attach a disk:
    # disk:
    #   name: caser-data
    #   mountPath: /var/data
    #   sizeGB: 1
services:
  - type: web
    name: caser-clone
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Render injects PORT automatically; the server binds 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
      # --- Database ----------------------------------------------------------
      # Leave DATABASE_URL empty to use a local SQLite file. NOTE: on the Free
      # plan the filesystem is ephemeral, so that file is lost on every
      # spin-down / redeploy.
      #
      # For a database that survives, create a free Turso database
      # (https://turso.tech) and paste the values here:
      #   DATABASE_URL=libsql://<db-name>.turso.io
      #   DATABASE_AUTH_TOKEN=<token>
      - key: DATABASE_URL
        value: ""
      - key: DATABASE_AUTH_TOKEN
        value: ""
      - key: DATA_DIR
        value: ./data
      # --- House edge ---------------------------------------------------------
      # RTP 0.80 = the house keeps 20% of everything wagered.
      - key: RTP
        value: "0.80"
      # Upgrade wheel: chance% = stake/targetPrice * this, clamped 1%..80%.
      # Leave empty to derive it from RTP. Set 103 for the real caser.one
      # numbers (that is a player edge, not a house edge).
      - key: UPGRADE_MULTIPLIER
        value: ""
      # --- Admin --------------------------------------------------------------
      # Token for /admin. Paste a long random string here, e.g.
      #   node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
      # Without it the server invents a new one on every boot.
      - key: ADMIN_TOKEN
        value: ""
      - key: ADMIN_IDS
        value: player_10001
      - key: CASES_CACHE_DIR
        value: ./cases_cache
      - key: REMOTE_CDN
        value: https://cdn.caser.day
    # Uncomment once you move to a paid plan and attach a disk:
    # disk:
    #   name: caser-data
    #   mountPath: /var/data
    #   sizeGB: 1